# Bir kere çalıştır: gerekli etiketi oluşturur ve eksik ayarları kontrol eder.
name: ✅ Kurulum Kontrolü

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: oyun-fikri etiketini oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create oyun-fikri --repo "${{ github.repository }}" --color 7C3AED \
            --description "Claude bu fikirden Unity oyunu yapar" --force

      - name: Gizli anahtarları ve ayarları kontrol et
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OK=true
          {
            echo "## ARC Oyun Fabrikası — kurulum durumu"
            echo
            echo "| Ayar | Durum |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          row() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }

          for s in UNITY_EMAIL UNITY_PASSWORD; do
            v="HAS_$s"
            if [ "${!v}" = "true" ]; then row "$s" "✅ var"; else row "$s" "❌ eksik"; OK=false; fi
          done

          if [ "$HAS_ANTHROPIC_KEY" = "true" ]; then row "ANTHROPIC_API_KEY (Claude API)" "✅ var";
          elif [ "$HAS_CLAUDE_TOKEN" = "true" ]; then row "Claude erişimi (abonelik token'ı)" "✅ var";
          else row "Claude anahtarı" "⚠️ yok: issue ile otomatik oyun kapalı. Oyunları Claude sohbetinden yaptırabilirsin"; fi

          if [ "$HAS_CF_TOKEN" = "true" ] && [ "$HAS_CF_ACCOUNT" = "true" ]; then
            USER_OK=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -c '"active"' || true)
            ACC_OK=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" | grep -c '"active"' || true)
            PAGES_OK=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -r 'if .success == true then 1 else 0 end' || echo 0)
            echo "user=$USER_OK account=$ACC_OK pages=$PAGES_OK"
            echo "Account ID uzunluğu: ${#CF_ACCOUNT} (32 olmalı), sadece hex mi: $(printf '%s' "$CF_ACCOUNT" | grep -Eqx '[0-9a-f]{32}' && echo evet || echo HAYIR)"
            echo "Token uzunluğu: ${#CF_TOKEN}, boşluk/satır sonu içeriyor mu: $(printf '%s' "$CF_TOKEN" | grep -q '[[:space:]]' && echo EVET || echo hayır)"
            echo "user verify hata: $(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '.errors')"
            echo "pages hata: $(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -c '.errors')"
            echo "pages yanıt: $(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -c '{success, proje_sayisi: (.result|length?)}')"
            echo "account verify hata: $(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" | jq -c '.errors')"
            if [ "$PAGES_OK" != "0" ]; then
              row "Cloudflare (web linki)" "✅ token Pages projelerine erişebiliyor"
            else row "Cloudflare (web linki)" "❌ token ya da Account ID hatalı (token: user=$USER_OK, account=$ACC_OK)"; OK=false; fi
          else
            row "Cloudflare (web linki)" "⚠️ ayarlı değil: oyunlar sadece Release'te zip/APK olarak gelir"
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" = "true" ]; then
            echo "🎉 **Her şey hazır!** Issues → New issue → 🎮 Oyun Fikri ile ilk oyununu iste." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "README'deki kurulum adımlarına göre ❌ olanları tamamla ve bu kontrolü tekrar çalıştır." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
