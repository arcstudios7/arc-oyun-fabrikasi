# Bir kere çalıştır: gerekli etiketi oluşturur ve eksik ayarları kontrol eder.
name: ✅ Kurulum Kontrolü

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: oyun-fikri etiketini oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create oyun-fikri --repo "${{ github.repository }}" --color 7C3AED \
            --description "Claude bu fikirden Unity oyunu yapar" --force

      - name: Gizli anahtarları ve ayarları kontrol et
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          OK=true
          {
            echo "## ARC Oyun Fabrikası — kurulum durumu"
            echo
            echo "| Ayar | Durum |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          row() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }

          for s in UNITY_EMAIL UNITY_PASSWORD; do
            v="HAS_$s"
            if [ "${!v}" = "true" ]; then row "$s" "✅ var"; else row "$s" "❌ eksik"; OK=false; fi
          done

          if [ "$HAS_ANTHROPIC_KEY" = "true" ]; then row "ANTHROPIC_API_KEY (Claude API)" "✅ var";
          elif [ "$HAS_CLAUDE_TOKEN" = "true" ]; then row "Claude erişimi (abonelik token'ı)" "✅ var";
          else row "Claude anahtarı" "⚠️ yok: issue ile otomatik oyun kapalı. Oyunları Claude sohbetinden yaptırabilirsin"; fi

          if [ "$HAS_CF_TOKEN" = "true" ] && [ "$HAS_CF_ACCOUNT" = "true" ]; then
            if curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -q '"active"'; then
              row "Cloudflare (web linki)" "✅ token geçerli"
            else row "Cloudflare (web linki)" "❌ CLOUDFLARE_API_TOKEN geçersiz"; OK=false; fi
          else
            row "Cloudflare (web linki)" "⚠️ ayarlı değil: oyunlar sadece Release'te zip/APK olarak gelir"
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" = "true" ]; then
            echo "🎉 **Her şey hazır!** Issues → New issue → 🎮 Oyun Fikri ile ilk oyununu iste." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "README'deki kurulum adımlarına göre ❌ olanları tamamla ve bu kontrolü tekrar çalıştır." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
