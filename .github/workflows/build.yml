# Unity projesini bulutta derler (GitHub runner'a Unity kurulur), web sürümünü GitHub Pages'e koyar,
# APK + web zip'ini bir Release olarak saklar ve (varsa) issue'ya link yazar.
name: 🛠️ Unity Build

on:
  push:
    branches: [main]
    paths: ["Assets/**", "Packages/**", "ProjectSettings/**"]
  workflow_dispatch:
    inputs:
      android:
        description: "Android APK da üretilsin mi? (yaklaşık 20-30 dk ekler)"
        type: boolean
        default: true
      ekran:
        description: "Otomatik ekran görüntüleri al (geliştirme için)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      issue_number:
        type: string
        default: ""
      android:
        type: boolean
        default: true
      ekran:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  webgl:
    name: 🌐 WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - name: Ücretsiz doku/model kaynaklarını önbellekten al
        uses: actions/cache@v4
        with:
          path: Assets/Resources/PH
          key: PH-${{ hashFiles('Assets/Scripts/Game/kaynaklar.json', 'tools/polyhaven.py') }}

      - name: Kaynakları indir (Poly Haven, CC0)
        run: python3 tools/polyhaven.py Assets/Scripts/Game/kaynaklar.json Assets/Resources/PH

      - name: Gerçek sokak ağını önbellekten al
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        uses: actions/cache@v4
        with:
          path: Assets/Resources/Harita/yollar.json
          key: OSM-${{ hashFiles('Assets/Scripts/Game/harita.json', 'tools/osm_yollar.py') }}

      - name: Gerçek sokak ağını indir (OpenStreetMap)
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        run: |
          if [ ! -s Assets/Resources/Harita/yollar.json ]; then
            python3 tools/osm_yollar.py Assets/Scripts/Game/harita.json Assets/Resources/Harita/yollar.json
          else
            echo "Önbellekten geldi."
          fi

      - name: Unity'yi kur
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          version-file: None
          unity-version: "6000.0.x"
          build-targets: WebGL
          cache-installation: true

      # Ücretsiz Personal lisans: .ulf dosyası gerekmez, Unity hesabıyla (e-posta + şifre) etkinleşir.
      - name: Unity lisansını etkinleştir
        uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Projeyi hazırla (Input System derleme sembolü)
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: WebGL
          log-name: WebGL-Prep
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.PrepareProject

      - name: Unity ile derle
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: WebGL
          log-name: WebGL-Build
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.BuildFromCommandLine
            -customBuildTarget WebGL
            -customBuildPath ${{ github.workspace }}/build/WebGL/Oyun

      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: build/WebGL/Oyun
          if-no-files-found: error

  windows:
    name: 🪟 Windows (PC)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Win-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Win-

      - name: Ücretsiz doku/model kaynaklarını önbellekten al
        uses: actions/cache@v4
        with:
          path: Assets/Resources/PH
          key: PH-${{ hashFiles('Assets/Scripts/Game/kaynaklar.json', 'tools/polyhaven.py') }}

      - name: Kaynakları indir (Poly Haven, CC0)
        run: python3 tools/polyhaven.py Assets/Scripts/Game/kaynaklar.json Assets/Resources/PH

      - name: Gerçek sokak ağını önbellekten al
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        uses: actions/cache@v4
        with:
          path: Assets/Resources/Harita/yollar.json
          key: OSM-${{ hashFiles('Assets/Scripts/Game/harita.json', 'tools/osm_yollar.py') }}

      - name: Gerçek sokak ağını indir (OpenStreetMap)
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        run: |
          if [ ! -s Assets/Resources/Harita/yollar.json ]; then
            python3 tools/osm_yollar.py Assets/Scripts/Game/harita.json Assets/Resources/Harita/yollar.json
          else
            echo "Önbellekten geldi."
          fi

      - name: Unity'yi kur
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          version-file: None
          unity-version: "6000.0.x"
          build-targets: StandaloneWindows64
          cache-installation: true

      # Ücretsiz Personal lisans: .ulf dosyası gerekmez, Unity hesabıyla (e-posta + şifre) etkinleşir.
      - name: Unity lisansını etkinleştir
        uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Projeyi hazırla (Input System derleme sembolü)
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: StandaloneWindows64
          log-name: Windows-Prep
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.PrepareProject

      - name: Unity ile derle
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: StandaloneWindows64
          log-name: Windows-Build
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.BuildFromCommandLine
            -customBuildTarget StandaloneWindows64
            -customBuildPath ${{ github.workspace }}/build/Windows/Oyun.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Windows
          if-no-files-found: error

  android:
    name: 📱 Android APK
    if: ${{ inputs.android == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Disk alanı aç (Android imajı büyük)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Ücretsiz doku/model kaynaklarını önbellekten al
        uses: actions/cache@v4
        with:
          path: Assets/Resources/PH
          key: PH-${{ hashFiles('Assets/Scripts/Game/kaynaklar.json', 'tools/polyhaven.py') }}

      - name: Kaynakları indir (Poly Haven, CC0)
        run: python3 tools/polyhaven.py Assets/Scripts/Game/kaynaklar.json Assets/Resources/PH

      - name: Gerçek sokak ağını önbellekten al
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        uses: actions/cache@v4
        with:
          path: Assets/Resources/Harita/yollar.json
          key: OSM-${{ hashFiles('Assets/Scripts/Game/harita.json', 'tools/osm_yollar.py') }}

      - name: Gerçek sokak ağını indir (OpenStreetMap)
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        run: |
          if [ ! -s Assets/Resources/Harita/yollar.json ]; then
            python3 tools/osm_yollar.py Assets/Scripts/Game/harita.json Assets/Resources/Harita/yollar.json
          else
            echo "Önbellekten geldi."
          fi

      - name: Unity'yi kur
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          version-file: None
          unity-version: "6000.0.x"
          build-targets: Android
          cache-installation: true

      # Ücretsiz Personal lisans: .ulf dosyası gerekmez, Unity hesabıyla (e-posta + şifre) etkinleşir.
      - name: Unity lisansını etkinleştir
        uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Projeyi hazırla (Input System derleme sembolü)
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: Android
          log-name: Android-Prep
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.PrepareProject

      - name: Unity ile derle
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: Android
          log-name: Android-Build
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.BuildFromCommandLine
            -customBuildTarget Android
            -customBuildPath ${{ github.workspace }}/build/Android/Oyun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/Android/*.apk
          if-no-files-found: error

  ekran:
    name: 📸 Ekran görüntüleri
    if: ${{ inputs.ekran == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Linux-

      - name: Ücretsiz doku/model kaynaklarını önbellekten al
        uses: actions/cache@v4
        with:
          path: Assets/Resources/PH
          key: PH-${{ hashFiles('Assets/Scripts/Game/kaynaklar.json', 'tools/polyhaven.py') }}

      - name: Kaynakları indir (Poly Haven, CC0)
        run: python3 tools/polyhaven.py Assets/Scripts/Game/kaynaklar.json Assets/Resources/PH

      - name: Gerçek sokak ağını önbellekten al
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        uses: actions/cache@v4
        with:
          path: Assets/Resources/Harita/yollar.json
          key: OSM-${{ hashFiles('Assets/Scripts/Game/harita.json', 'tools/osm_yollar.py') }}

      - name: Gerçek sokak ağını indir (OpenStreetMap)
        if: ${{ hashFiles('Assets/Scripts/Game/harita.json') != '' }}
        run: |
          if [ ! -s Assets/Resources/Harita/yollar.json ]; then
            python3 tools/osm_yollar.py Assets/Scripts/Game/harita.json Assets/Resources/Harita/yollar.json
          else
            echo "Önbellekten geldi."
          fi

      - name: Unity'yi kur
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          version-file: None
          unity-version: "6000.0.x"
          build-targets: StandaloneLinux64
          cache-installation: true

      - name: Unity lisansını etkinleştir
        uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Projeyi hazırla (Input System derleme sembolü)
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: StandaloneLinux64
          log-name: Linux-Prep
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.PrepareProject

      - name: Linux sürümünü derle
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: StandaloneLinux64
          log-name: Linux-Build
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.BuildFromCommandLine
            -customBuildTarget StandaloneLinux64
            -customBuildPath ${{ github.workspace }}/build/Linux/Oyun.x86_64

      - name: Oyunu sanal ekranda çalıştır ve fotoğrafla
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          mkdir -p shots
          chmod +x build/Linux/Oyun.x86_64
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/Linux/Oyun.x86_64 -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 \
            -logFile "$PWD/shots/player.log" -arcshot "$PWD/shots" || echo "oyun çıkış kodu: $?"
          ls -la shots
          grep -E "ArcShot|Exception|Error|error|warning \[Arc\]|\[Arc\]" shots/player.log | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran
          path: shots

      # Görüntüleri repodaki "ekran" dalına da koy (Claude buradan okuyup görür).
      - name: Görüntüleri 'ekran' dalına gönder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots || exit 0
          git init -q && git checkout -q -b ekran
          git add -A
          git -c user.name="ARC Oyun Fabrikası" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Ekran görüntüleri: çalıştırma ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ekran

  publish:
    name: 🚀 Yayınla
    needs: [webgl, windows, android]
    if: ${{ always() && (needs.webgl.result == 'success' || needs.windows.result == 'success') && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: yayin
      cancel-in-progress: false
    env:
      CF_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/download-artifact@v4
        if: ${{ needs.webgl.result == 'success' }}
        with:
          name: webgl
          path: site

      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: windows
          path: windows

      - uses: actions/download-artifact@v4
        if: ${{ needs.android.result == 'success' }}
        with:
          name: android
          path: apk

      # Private repoda GitHub Pages ücretsiz değil; web sürümü Cloudflare Pages'e gider.
      # Her oyun kendi projesine yüklenir (arc-<slug>.pages.dev), böylece eski oyunlar da yayında kalır.
      - name: Cloudflare Pages'e yükle
        id: cf
        if: ${{ env.CF_ENABLED == 'true' && needs.webgl.result == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARC_DOMAIN: ${{ vars.ARC_DOMAIN }}
        run: |
          set -e
          SLUG=$(grep -oP 'Slug\s*=\s*"\K[^"]+' Assets/Scripts/Game/GameInfo.cs || echo "oyun")
          PROJ=$(echo "arc-${SLUG}" | tr -cd 'a-z0-9-' | cut -c1-58)
          npx --yes wrangler@4 pages project create "$PROJ" --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy site --project-name "$PROJ" --branch main --commit-dirty=true
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJ" | jq -r '.result.subdomain // empty')
          TARGET="${SUB:-$PROJ.pages.dev}"
          URL="https://$TARGET"

          # pages.dev bazı Türk internet sağlayıcılarında engelli: oyunu kendi alan adının altına da bağla.
          # <slug>.arcstudios.com.tr  (tek seviye alt alan adı: ücretsiz SSL sertifikası bunu kapsar)
          ZONE_NAME="${ARC_DOMAIN:-arcstudios.com.tr}"
          HOST="${SLUG}.${ZONE_NAME}"
          cf() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          API=https://api.cloudflare.com/client/v4
          ZONE_ID=$(cf "$API/zones?name=$ZONE_NAME" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::Token $ZONE_NAME alan adını göremiyor (Zone:DNS:Edit izni eksik). Sadece pages.dev adresi kullanılıyor."
          else
            REC=$(cf "$API/zones/$ZONE_ID/dns_records?name=$HOST")
            REC_ID=$(echo "$REC" | jq -r '.result[0].id // empty')
            REC_CONTENT=$(echo "$REC" | jq -r '.result[0].content // empty')
            if [ -z "$REC_ID" ]; then
              cf -X POST "$API/zones/$ZONE_ID/dns_records" \
                -d "{\"type\":\"CNAME\",\"name\":\"$HOST\",\"content\":\"$TARGET\",\"proxied\":true,\"comment\":\"ARC Oyun Fabrikası\"}" | jq -c '{success, errors}'
              REC_CONTENT="$TARGET"
            fi
            if [ "$REC_CONTENT" = "$TARGET" ]; then
              cf -X POST "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJ/domains" -d "{\"name\":\"$HOST\"}" | jq -c '{success, errors}'
              URL="https://$HOST"
            else
              echo "::warning::$HOST zaten başka bir yere ($REC_CONTENT) bağlı; dokunulmadı. pages.dev adresi kullanılıyor."
            fi
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "alt=https://$TARGET" >> "$GITHUB_OUTPUT"

      - name: Release oluştur ve haber ver
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.cf.outputs.url }}
          ALT_URL: ${{ steps.cf.outputs.alt }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -e
          TITLE=$(grep -oP 'Title\s*=\s*"\K[^"]+' Assets/Scripts/Game/GameInfo.cs || echo "Oyun")
          SLUG=$(grep -oP 'Slug\s*=\s*"\K[^"]+' Assets/Scripts/Game/GameInfo.cs || echo "oyun")
          TAG="${SLUG}-$(date -u +%Y%m%d-%H%M%S)"

          FILES=""
          if [ -d site ]; then (cd site && zip -qr "../${SLUG}-web.zip" .); FILES="${SLUG}-web.zip"; fi
          WIN=""
          if [ -d windows ]; then (cd windows && zip -qr "../${SLUG}-windows.zip" .); FILES="$FILES ${SLUG}-windows.zip"; WIN=1; fi
          APK=$(ls apk/*.apk 2>/dev/null | head -n1 || true)
          if [ -n "$APK" ]; then cp "$APK" "${SLUG}.apk"; FILES="$FILES ${SLUG}.apk"; fi
          if [ -n "$PAGE_URL" ]; then
            WEB_LINE="▶️ **Tarayıcıda oyna (telefon/PC):** ${PAGE_URL}"
            if [ -n "$ALT_URL" ] && [ "$ALT_URL" != "$PAGE_URL" ]; then WEB_LINE="${WEB_LINE} (yedek: ${ALT_URL})"; fi
          else
            WEB_LINE="🌐 Web linki için Cloudflare anahtarlarını ekle (README → 4. adım). Şimdilik web sürümü Release'teki \`${SLUG}-web.zip\` içinde."
          fi

          {
            echo "## 🎮 ${TITLE}"
            echo
            echo "$WEB_LINE"
            echo
            if [ -f GAME.md ]; then cat GAME.md; fi
          } > notes.md

          gh release create "$TAG" $FILES --title "🎮 ${TITLE}" --notes-file notes.md --target "$(git rev-parse HEAD)"
          REL_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"

          {
            echo "## 🎮 Oyun yayınlandı: ${TITLE}"
            echo "| Hedef | Durum |"
            echo "|---|---|"
            echo "| Web | ${PAGE_URL:-Cloudflare ayarlı değil} |"
            echo "| İndirmeler (APK + web zip) | ${REL_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ISSUE" ]; then
            {
              echo "✅ **Oyunun hazır: ${TITLE}**"
              echo
              echo "$WEB_LINE"
              if [ -n "$WIN" ]; then echo "🖥️ **PC (Windows):** ${REL_URL} (\`${SLUG}-windows.zip\` indir, klasöre çıkar, \`Oyun.exe\`yi çalıştır)"; fi
              if [ -n "$APK" ]; then echo "📱 **Android APK:** ${REL_URL} (\`${SLUG}.apk\` dosyasını indirip telefona kur — repo private olduğu için GitHub'a giriş yapmış olman gerekir)"; fi
              echo
              echo "Değişiklik istersen bu issue'ya \`/oyun <ne değişsin>\` yaz. Örnek: \`/oyun daha hızlı olsun ve can sistemi ekle\`"
              echo
              echo "_Not: Tarayıcı eski sürümü gösterirse sayfayı yenile (Ctrl+F5)._"
            } > comment.md
            gh issue comment "$ISSUE" --body-file comment.md
          fi

  notify-failure:
    name: ❌ Hata bildir
    needs: [webgl, windows, android, publish]
    if: ${{ failure() && inputs.issue_number != '' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${{ inputs.issue_number }}" --repo "${{ github.repository }}" --body "❌ **Build başarısız oldu.** Kodda Unity'nin kabul etmediği bir hata var.

          Düzeltmek için bu issue'ya sadece şunu yaz: \`/oyun düzelt\` — Claude hata kaydını okuyup onaracak ve yeniden build alacak.

          [Ayrıntılı log]($RUN_URL)"
