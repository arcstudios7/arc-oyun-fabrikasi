# Unity projesini bulutta derler (GitHub runner'a Unity kurulur), web sürümünü GitHub Pages'e koyar,
# APK + web zip'ini bir Release olarak saklar ve (varsa) issue'ya link yazar.
name: 🛠️ Unity Build

on:
  push:
    branches: [main]
    paths: ["Assets/**", "Packages/**", "ProjectSettings/**"]
  workflow_dispatch:
    inputs:
      android:
        description: "Android APK da üretilsin mi? (yaklaşık 20-30 dk ekler)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      issue_number:
        type: string
        default: ""
      android:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  webgl:
    name: 🌐 WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - name: Unity'yi kur
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          version-file: None
          unity-version: "6000.0.x"
          build-targets: WebGL
          cache-installation: true

      # Ücretsiz Personal lisans: .ulf dosyası gerekmez, Unity hesabıyla (e-posta + şifre) etkinleşir.
      - name: Unity lisansını etkinleştir
        uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Unity ile derle
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: WebGL
          log-name: WebGL-Build
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.BuildFromCommandLine
            -customBuildTarget WebGL
            -customBuildPath ${{ github.workspace }}/build/WebGL/Oyun

      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: build/WebGL/Oyun
          if-no-files-found: error

  android:
    name: 📱 Android APK
    if: ${{ inputs.android == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Disk alanı aç (Android imajı büyük)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Unity'yi kur
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          version-file: None
          unity-version: "6000.0.x"
          build-targets: Android
          cache-installation: true

      # Ücretsiz Personal lisans: .ulf dosyası gerekmez, Unity hesabıyla (e-posta + şifre) etkinleşir.
      - name: Unity lisansını etkinleştir
        uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Unity ile derle
        uses: RageAgainstThePixel/unity-action@v4
        with:
          project-path: ${{ github.workspace }}
          build-target: Android
          log-name: Android-Build
          args: >-
            -quit -batchmode -nographics
            -executeMethod ArcBuild.BuildFromCommandLine
            -customBuildTarget Android
            -customBuildPath ${{ github.workspace }}/build/Android/Oyun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/Android/*.apk
          if-no-files-found: error

  publish:
    name: 🚀 Yayınla
    needs: [webgl, android]
    if: ${{ always() && needs.webgl.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: yayin
      cancel-in-progress: false
    env:
      CF_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: webgl
          path: site

      - uses: actions/download-artifact@v4
        if: ${{ needs.android.result == 'success' }}
        with:
          name: android
          path: apk

      # Private repoda GitHub Pages ücretsiz değil; web sürümü Cloudflare Pages'e gider.
      # Her oyun kendi projesine yüklenir (arc-<slug>.pages.dev), böylece eski oyunlar da yayında kalır.
      - name: Cloudflare Pages'e yükle
        id: cf
        if: ${{ env.CF_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SLUG=$(grep -oP 'Slug\s*=\s*"\K[^"]+' Assets/Scripts/Game/GameInfo.cs || echo "oyun")
          PROJ=$(echo "arc-${SLUG}" | tr -cd 'a-z0-9-' | cut -c1-58)
          npx --yes wrangler@4 pages project create "$PROJ" --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy site --project-name "$PROJ" --branch main --commit-dirty=true
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJ" | jq -r '.result.subdomain // empty')
          echo "url=https://${SUB:-$PROJ.pages.dev}" >> "$GITHUB_OUTPUT"

      - name: Release oluştur ve haber ver
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.cf.outputs.url }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -e
          TITLE=$(grep -oP 'Title\s*=\s*"\K[^"]+' Assets/Scripts/Game/GameInfo.cs || echo "Oyun")
          SLUG=$(grep -oP 'Slug\s*=\s*"\K[^"]+' Assets/Scripts/Game/GameInfo.cs || echo "oyun")
          TAG="${SLUG}-$(date -u +%Y%m%d-%H%M%S)"

          (cd site && zip -qr "../${SLUG}-web.zip" .)
          FILES="${SLUG}-web.zip"
          APK=$(ls apk/*.apk 2>/dev/null | head -n1 || true)
          if [ -n "$APK" ]; then cp "$APK" "${SLUG}.apk"; FILES="$FILES ${SLUG}.apk"; fi
          if [ -n "$PAGE_URL" ]; then
            WEB_LINE="▶️ **Tarayıcıda oyna (telefon/PC):** ${PAGE_URL}"
          else
            WEB_LINE="🌐 Web linki için Cloudflare anahtarlarını ekle (README → 4. adım). Şimdilik web sürümü Release'teki \`${SLUG}-web.zip\` içinde."
          fi

          {
            echo "## 🎮 ${TITLE}"
            echo
            echo "$WEB_LINE"
            echo
            if [ -f GAME.md ]; then cat GAME.md; fi
          } > notes.md

          gh release create "$TAG" $FILES --title "🎮 ${TITLE}" --notes-file notes.md --target "$(git rev-parse HEAD)"
          REL_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"

          {
            echo "## 🎮 Oyun yayınlandı: ${TITLE}"
            echo "| Hedef | Durum |"
            echo "|---|---|"
            echo "| Web | ${PAGE_URL:-Cloudflare ayarlı değil} |"
            echo "| İndirmeler (APK + web zip) | ${REL_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ISSUE" ]; then
            {
              echo "✅ **Oyunun hazır: ${TITLE}**"
              echo
              echo "$WEB_LINE"
              if [ -n "$APK" ]; then echo "📱 **Android APK:** ${REL_URL} (\`${SLUG}.apk\` dosyasını indirip telefona kur — repo private olduğu için GitHub'a giriş yapmış olman gerekir)"; fi
              echo
              echo "Değişiklik istersen bu issue'ya \`/oyun <ne değişsin>\` yaz. Örnek: \`/oyun daha hızlı olsun ve can sistemi ekle\`"
              echo
              echo "_Not: Tarayıcı eski sürümü gösterirse sayfayı yenile (Ctrl+F5)._"
            } > comment.md
            gh issue comment "$ISSUE" --body-file comment.md
          fi

  notify-failure:
    name: ❌ Hata bildir
    needs: [webgl, android, publish]
    if: ${{ failure() && inputs.issue_number != '' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${{ inputs.issue_number }}" --repo "${{ github.repository }}" --body "❌ **Build başarısız oldu.** Kodda Unity'nin kabul etmediği bir hata var.

          Düzeltmek için bu issue'ya sadece şunu yaz: \`/oyun düzelt\` — Claude hata kaydını okuyup onaracak ve yeniden build alacak.

          [Ayrıntılı log]($RUN_URL)"
