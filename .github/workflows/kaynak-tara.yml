# Geliştirici aracı: ücretsiz (CC0) doku / HDRI / model kaynaklarını tarar ve listeler.
name: 🔎 Kaynak Tarama

on:
  workflow_dispatch:
    inputs:
      ara:
        description: "Aranacak kelimeler (boşlukla)"
        default: "asphalt road sidewalk cobble paving brick plaster concrete tile wood metal facade"
        type: string

permissions:
  contents: read

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Poly Haven
        env:
          ARA: ${{ inputs.ara }}
        run: |
          UA="ARC-Oyun-Fabrikasi/1.0 (+https://arcstudios.com.tr)"
          for t in textures hdris models; do
            curl -sf -A "$UA" "https://api.polyhaven.com/assets?t=$t" > "$t.json" || echo "{}" > "$t.json"
            echo "== $t: $(jq 'length' "$t.json") adet"
          done
          echo "== HDRI kategorileri"; jq -r '[.[] | .categories[]] | group_by(.) | map("\(.[0]):\(length)") | join(", ")' hdris.json
          echo "== Model kategorileri"; jq -r '[.[] | .categories[]] | group_by(.) | map("\(.[0]):\(length)") | join(", ")' models.json
          echo "== Doku kategorileri"; jq -r '[.[] | .categories[]] | group_by(.) | map("\(.[0]):\(length)") | join(", ")' textures.json
          for w in $ARA; do
            echo "== doku '$w':"; jq -r --arg w "$w" 'to_entries[] | select((.key|test($w)) or ((.value.tags//[])|index($w))) | "\(.key) [\(.value.categories|join("/"))] dl=\(.value.download_count)"' textures.json | awk -F'dl=' '{print $2"\t"$0}' | sort -nr | cut -f2 | head -10
          done
          echo "== Şehir/gün batımı HDRI:"; jq -r 'to_entries[] | select(.value.categories | (index("urban") or index("sunrise-sunset"))) | "\(.key) [\(.value.categories|join("/"))] dl=\(.value.download_count)"' hdris.json | awk -F'dl=' '{print $2"\t"$0}' | sort -nr | cut -f2 | head -25
          for w in motor bike scooter car vehicle person man woman human street lamp bench sign traffic cone barrier food door table chair plant tree; do
            echo "== model '$w':"; jq -r --arg w "$w" 'to_entries[] | select((.key|test($w)) or ((.value.tags//[])|index($w)) or ((.value.categories//[])|index($w))) | "\(.key) [\(.value.categories|join("/"))]"' models.json | head -6
          done
          echo "== örnek dosya listesi (doku)"; K=$(jq -r 'keys[0]' textures.json); curl -sf -A "$UA" "https://api.polyhaven.com/files/$K" | jq -c '{keys: keys, diff: (.Diffuse."1k"|keys?)}'
          echo "== örnek dosya listesi (model)"; K=$(jq -r 'keys[0]' models.json); curl -sf -A "$UA" "https://api.polyhaven.com/files/$K" | jq -c 'keys'; curl -sf -A "$UA" "https://api.polyhaven.com/files/$K" | jq -c '.gltf."1k"? // .gltf'  | head -c 600; echo

      - name: Diğer kaynaklar erişilebilir mi
        run: |
          for u in https://ambientcg.com/api/v2/full_json?limit=1 https://kenney.nl/assets https://packages.unity.com/com.unity.render-pipelines.universal https://packages.unity.com/com.unity.cloud.gltfast https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb; do
            printf "%-100s %s\n" "$u" "$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$u")"
          done
          echo "== URP sürümleri (6000.0 uyumlu 17.0.x):"; curl -s https://packages.unity.com/com.unity.render-pipelines.universal | jq -r '.versions | keys[] | select(startswith("17.0"))' | tail -5
          echo "== glTFast sürümleri:"; curl -s https://packages.unity.com/com.unity.cloud.gltfast | jq -r '.versions | keys[]' | tail -5
